<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint into the notch area; the safe-area insets in
         index.css are what keep content out from under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D69D8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0E16" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SGAM" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores an SVG apple-touch-icon and puts a screenshot of the page on the home
         screen instead, so this one has to be a PNG. 180px is what current iPhones ask for. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      /* Decide the theme before React mounts. The class is otherwise applied in an effect, so a
         device in dark mode would paint a white screen first and flip — once per launch, on the
         slowest frame there is. Mirrors uiStore: a saved explicit choice wins, the OS decides
         otherwise. Wrapped because localStorage throws outright in some privacy modes. */
      try {
        var saved = JSON.parse(localStorage.getItem('ui-storage') || '{}').state || {};
        var dark = saved.themeExplicit
          ? saved.theme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>SGAM — Project Management</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
